<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SPOT Editor — Whitepaper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Whitepaper: a browser-based collaborative code editor built for Launch School peer study sessions.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <style>
    :root {
      --base-font-size: 16px;
      --base-font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --code-font-family: 'JetBrains Mono', SFMono-Regular, Consolas, monospace;
      --theme-color: #5b4dff;
      --link-color: #5b4dff;
      --sidebar-background: #fafaff;
    }

    body { text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }

    .sidebar { border-right: 1px solid #ececf7; }
    .sidebar > h1 { margin: 0 0 .2em; }
    .sidebar > h1 a { color: var(--theme-color); font-weight: 800; letter-spacing: -0.02em; }
    .sidebar > h1 .app-sub-title { display: block; font-size: 12px; font-weight: 500; color: #8b8b9e; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 2px; }

    .sidebar-nav > ul > li > a { font-weight: 600; color: #2b2b3d; }
    .sidebar-nav li.active > a { color: var(--theme-color); }

    .markdown-section { max-width: 860px; font-size: 17px; line-height: 1.75; }
    .markdown-section h1 { font-weight: 800; letter-spacing: -0.02em; border-bottom: 2px solid #f0eefe; padding-bottom: .3em; }
    .markdown-section h2 { font-weight: 700; border-bottom: none; margin-top: 2.2em; }
    .markdown-section h3 { font-weight: 600; color: #3d3d52; }
    .markdown-section code { background: #f3f1fe; color: #5b4dff; border-radius: 4px; }
    .markdown-section pre { border-radius: 8px; }
    .markdown-section blockquote { border-left: 4px solid var(--theme-color); background: #faf9ff; padding: .6em 1em; border-radius: 0 6px 6px 0; }
    /* will-change promotes each image to its own GPU compositor layer. Safari
       already does this automatically for box-shadow + border-radius elements,
       but Chrome often doesn't - without this hint, Chrome re-rasterizes the
       blurred shadow on the main thread as part of every scroll frame, which is
       the likely cause of Chrome-only scroll jank on a page with several of
       these images (confirmed: smooth in Safari, laggy in Chrome). */
    .markdown-section img { border-radius: 8px; box-shadow: 0 2px 16px rgba(30, 20, 90, 0.08); will-change: transform; }
    .markdown-section video { border-radius: 8px; box-shadow: 0 2px 16px rgba(30, 20, 90, 0.08); max-width: 100%; }
    .markdown-section a { color: var(--theme-color); }
    .markdown-section ol > li > ul, .markdown-section ol > li > ol { padding-left: 2.25rem; margin: 0.6em 0; }

    .app-name-link img { height: 28px; }

    section.cover { justify-content: center; }
    section.cover .cover-main { max-width: 820px; margin: 0 auto; flex: none; width: 100%; }
    section.cover h1 { font-weight: 800; letter-spacing: -0.02em; }
    .cover-main > p:last-child a { border-radius: 8px; font-weight: 600; }
    /* Matches vue.css's own "section.cover .cover-main>p:last-child" prefix so this wins
       on specificity + later source order. Needed because our GitHub link is no longer
       a:last-child (the scroll-cue span after it took that spot), so the theme's own
       a:last-child{color:#fff} rule (which normally gives filled buttons white text) no
       longer applies - without this, the text color falls back to the theme purple,
       same as the button background, making it invisible. */
    section.cover .cover-main > p:last-child a:first-child {
      background: var(--theme-color);
      border-color: var(--theme-color);
      color: #fff;
    }
    section.cover .cover-main > p:last-child a:first-child:hover,
    section.cover .cover-main > p:last-child a:first-child:focus-visible {
      color: #fff;
      opacity: 0.85;
    }

    .scroll-cue {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      margin: 1.75rem auto 0;
      border-radius: 50%;
      border: 1.5px solid rgba(91, 77, 255, 0.35);
      color: var(--theme-color);
      cursor: pointer;
      animation: scrollCueBounce 1.8s ease-in-out infinite;
    }
    .scroll-cue:hover, .scroll-cue:focus-visible { background: rgba(91, 77, 255, 0.08); outline: none; }
    @keyframes scrollCueBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }

    /* The search plugin inserts .search as a sibling *before* <aside class="sidebar">,
       not inside it - since .sidebar is absolutely positioned with a higher z-index and
       an opaque background, it paints over that sibling and hides it completely. The
       script below re-parents it as the sidebar's first child instead. */
    .sidebar .search { flex-shrink: 0; }

    /* Safari applies native rounded-pill styling + its own decoration/cancel-button
       pseudo-elements to input[type=search], which clashes with the plugin's own
       custom clear button and can make the field unusable. Reset to a plain text field. */
    .search input[type="search"] {
      -webkit-appearance: textfield;
      appearance: textfield;
    }
    .search input[type="search"]::-webkit-search-decoration,
    .search input[type="search"]::-webkit-search-cancel-button,
    .search input[type="search"]::-webkit-search-results-button,
    .search input[type="search"]::-webkit-search-results-decoration {
      -webkit-appearance: none;
      appearance: none;
    }

    #carbonads, .anchor { transition: none; }
  </style>
</head>
<body>
  <div id="app">Loading whitepaper…</div>

  <script>
    window.$docsify = {
      name: 'SPOT Editor <span class="app-sub-title">Whitepaper</span>',
      nameLink: '#/',
      repo: 'karishmatank/collaborative-code-editor',
      homepage: 'WHITEPAPER.md',
      coverpage: true,
      onlyCover: false,
      loadSidebar: true,
      // Docsify re-resolves "_sidebar.md" relative to the current route's directory
      // on every navigation (for per-folder sidebars), with a fallback chain that
      // walks up to parent directories if that lookup fails. This per-navigation
      // resolution is what can intermittently fail/race, making the sidebar vanish
      // until a hard refresh - a known Docsify issue (see docsifyjs/docsify#2555).
      // Since we only have one sidebar at the root, pin it directly and skip that
      // fragile per-directory resolution entirely.
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      subMaxLevel: 0,
      auto2top: true,
      autoHeader: false,
      loadNavbar: false,
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search the whitepaper...',
        noData: 'No results found.',
        depth: 4
      },
      pagination: {
        crossChapter: true,
        crossChapterText: true
      },
      formatUpdated: '{MM}/{DD}/{YYYY}'
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script>
    // The search plugin inserts its box as a sibling right before <aside class="sidebar">
    // instead of inside it, so the sidebar's absolutely-positioned, opaque panel paints
    // over it and hides it. Move it inside the sidebar (as the first child, above the
    // nav) every time Docsify finishes rendering a page.
    window.$docsify.plugins = [].concat(window.$docsify.plugins || [], function (hook) {
      function moveSearchIntoSidebar() {
        var search = document.querySelector('.search');
        var sidebar = document.querySelector('.sidebar');
        if (search && sidebar && sidebar.firstElementChild !== search) {
          sidebar.insertBefore(search, sidebar.firstChild);
        }
      }

      // _sidebar.md has two TOCs (Whitepaper, Architecture) separated by a "---",
      // which Docsify/marked.js render as two sibling <ul>s split by an <hr>. Only
      // show the TOC for whichever doc is currently open, so the sidebar doesn't
      // show both docs' sections at once.
      //
      // Note: Docsify's router strips ".md" when it rewrites markdown links into
      // hash URLs (e.g. "ARCHITECTURE.md#architecture" becomes "#/ARCHITECTURE?id=
      // architecture"), so matching must be done against "#/ARCHITECTURE", not
      // "ARCHITECTURE.md".
      function updateSidebarSections() {
        var nav = document.querySelector('.sidebar-nav');
        if (!nav) return;
        var isArchitecturePage = /^#\/ARCHITECTURE(\?|$)/i.test(window.location.hash || '');
        Array.prototype.forEach.call(nav.children, function (el) {
          if (el.tagName === 'UL') {
            var isArchitectureGroup = /href="#\/ARCHITECTURE(\?|")/i.test(el.innerHTML);
            el.style.display = (isArchitecturePage === isArchitectureGroup) ? '' : 'none';
          } else if (el.tagName === 'HR') {
            el.style.display = 'none';
          }
        });
      }

      hook.doneEach(function () {
        moveSearchIntoSidebar();
        updateSidebarSections();
      });
      hook.mounted(function () {
        moveSearchIntoSidebar();
        updateSidebarSections();
      });
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
</body>
</html>
